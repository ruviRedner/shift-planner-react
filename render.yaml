services:
  - type: web
    name: shift-planner
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
      - key: VITE_SHARED_ONLY
        value: "true"
      - key: VITE_PUBLIC_EDITING
        value: "true"
      - key: PUBLIC_EDITING
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: PLANNER_SETUP_TOKEN
        generateValue: true
