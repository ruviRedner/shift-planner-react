services:
  - type: web
    name: shift-planner
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
      - key: VITE_SHARED_ONLY
        value: "true"
      - key: PLANNER_DATA_FILE
        value: /var/data/team.json
      - key: PLANNER_SETUP_TOKEN
        generateValue: true
    disk:
      name: planner-data
      mountPath: /var/data
      sizeGB: 1
